<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A9E99">
<meta name="description" content="صحتي: تتبع الأكل والسعرات والماء والتمارين والقياسات والتحاليل">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صحتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>صحتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: Samsung Health style, stacked rounded tracker cards on a soft grey canvas, colored per metric, bottom tab bar */
:root{
  --bg:#F2F3F6; --card:#FFFFFF; --ink:#17181C; --muted:#6C707B; --line:#E4E6EB; --soft:#F6F7F9;
  --accent:#1A9E99; --steps:#25B862; --food:#F0922B; --water:#2D8CE6; --sleep:#7357F2; --gym:#EF5345; --weight:#14A39A; --lab:#C2477F;
  --ok:#25B862; --warn:#E89B1A; --bad:#E0483D;
  --display:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1013; --card:#1B1C21; --ink:#F1F2F5; --muted:#9A9EA9; --line:#2C2E35; --soft:#24262C;
    --accent:#2BBDB7; --steps:#3DD47A; --food:#F7A84A; --water:#5AA9F2; --sleep:#9580FF; --gym:#FF6E61; --weight:#2CC4B9; --lab:#E36AA2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1013; --card:#1B1C21; --ink:#F1F2F5; --muted:#9A9EA9; --line:#2C2E35; --soft:#24262C;
  --accent:#2BBDB7; --steps:#3DD47A; --food:#F7A84A; --water:#5AA9F2; --sleep:#9580FF; --gym:#FF6E61; --weight:#2CC4B9; --lab:#E36AA2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 10px}
.top h1{font-family:var(--display);font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.stack{display:grid;gap:12px}
.card{background:var(--card);border-radius:24px;padding:18px}
.card h2{font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--muted)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:16px;height:16px}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.big small{font-size:15px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 8px}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--soft);border-radius:18px;padding:12px}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.list{display:grid;gap:2px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.alert .dot{margin-top:7px;flex:none}
.rings{display:flex;align-items:center;gap:18px}
.legend{display:grid;gap:8px;flex:1}
.legend div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.legend b{font-variant-numeric:tabular-nums}
.legend .bar{display:block;width:100%}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.glass{width:22px;height:28px;border-radius:4px 4px 8px 8px;border:2px solid var(--water);position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;inset:30% 0 0 0;background:var(--water)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%}
.tab{border:0;background:transparent;padding:8px 2px calc(12px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:4px}
.datenav b{font-size:15px}
.meal{margin-top:4px}
.ex{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{width:38px;height:38px;border-radius:50%;border:2px solid var(--gym);background:transparent;cursor:pointer;font-weight:700;color:var(--gym)}
.set.on{background:var(--gym);color:#fff}
.yt{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;text-decoration:none;color:var(--gym)}
.kg{width:90px}
.daycard{border-radius:18px;background:var(--soft);padding:12px}
.daycard.today{outline:2px solid var(--accent)}
.daycard p{margin:4px 0;font-size:14px}
.tag{font-size:11px;font-weight:700;color:var(--muted)}
ul.clean{margin:0;padding:0 18px 0 0;display:grid;gap:4px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 12px;font-size:18px}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.fopt{display:flex;justify-content:space-between;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:right}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.preview div{background:var(--soft);border-radius:14px;padding:8px 2px}
.preview b{display:block;font-variant-numeric:tabular-nums}
.preview span{font-size:11px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30}
.toast[hidden]{display:none}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.credit{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 8px;direction:ltr}
.note{background:var(--soft);border-radius:16px;padding:12px;font-size:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .4s} .ring-fg{transition:stroke-dashoffset .5s} }
@media (max-width:400px){ .grid3{grid-template-columns:1fr 1fr} .preview{grid-template-columns:repeat(3,1fr)} .rings{flex-direction:column;align-items:stretch} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="ttl">صحتي</h1>
      <div class="sub" id="subttl"></div>
    </div>
    <div class="row">
      <span class="sync" id="sync"></span>
      <button class="iconbtn" id="setbtn" aria-label="الإعدادات" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"><div class="loading">لحظة، أجهز بياناتك...</div></main>
  <div class="credit">Designed &amp; Developed by Nora Aldossari</div>
</div>

<nav class="tabs" aria-label="الأقسام"><div class="in">
  <button class="tab" data-tab="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button class="tab" data-tab="food" onclick="go('food')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg>الأكل</button>
  <button class="tab" data-tab="gym" onclick="go('gym')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>التمارين</button>
  <button class="tab" data-tab="progress" onclick="go('progress')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>التقدم</button>
  <button class="tab" data-tab="plan" onclick="go('plan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>خطتي</button>
</div></nav>

<div class="sheet" id="sheet" hidden onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ DATA: suggested plan ============ */
const START_DATE = (()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
const AR_DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const GYM = {};
const PLAN_DEFAULT_NOTE = "خطة مقترحة متوازنة، عدليها على ذوقك";

const PLAN = {
  6:{b:"بيضتين مسلوقة، جبن فيتا، خيار وطماطم وزيتون، خبزة بر", s:"سموذي توت وموز وتمرة وحدة بعد النادي", l:"صدور دجاج مشوية، ربع صحن رز أبيض، سلطة"},
  0:{b:"شكشوكة بالطماطم والبيض، خبزة بر", s:"قهوة مع ٣ تمرات", l:"صحن حمص ودجاج مشوي بالطحينة، سلطة"},
  1:{b:"توست بر شريحتين بجبن شرائح وجزر مبشور، بيضة", s:"زبادي يوناني مع تمرة", l:"سمك أو روبيان مشوي، ربع صحن رز، سلطة"},
  2:{b:"لبنة بزيت زيتون، خيار وزيتون، خبزة بر", s:"قهوة مع ٣ تمرات", l:"رز وملوخية، سلطة"},
  3:{b:"توست بر بالأفوكادو، بيضة مسلوقة، شوية فيتا", s:"سموذي توت وموز وتمرة وحدة", l:"بطاطس مشوية بالفرن، دجاج، خضار مشوية بزيت زيتون"},
  4:{b:"شوفان بالحليب مع موز وتمرة وقرفة", s:"أكتيفيا الصافي مع تمرة", l:"كبسة دجاج برز أقل، سلطة كبيرة"},
  5:{b:"فطوري المفضل براحتي", s:"قهوة مع ٣ تمرات", l:"وجبة الدلع: مكرونة بر بالخضار والجبن والكريمة مع صدور دجاج"}
};
const WEEK_ORDER = [6,0,1,2,3,4,5];
const SNACKS = ["قهوة مع ٣ تمرات","زبادي يوناني مع تمرة","أكتيفيا الصافي مع تمرة","سموذي توت وموز بتمرة وحدة بدل العسل: مرتين بالأسبوع بعد النادي"];
const ALTS = [
  ["الفطور","توست بر محمص بجبن شيدر وطماطم، بيضتين مع خبزة بر وزيتون"],
  ["الغدا","رز وحريش مع سلطة، شوربة عدس مع خبزة بر، مشاوي مع حمص وخبز بر، ورق عنب أو كوسا محشي بكمية معتدلة، بطاطس مسلوقة مع دجاج وخضار"],
  ["وجبة الدلع","مكرونة بر بصلصة الطماطم والريحان، بيتزا على خبز بر بالخضار والدجاج، برجر دجاج مشوي مع بطاطس بالفرن"]
];
const RULES = [
  "لا مقليات ولا حلويات ولا شيبس",
  "الصحن: نصه خضار، ربعه بروتين، ربعه رز أو نشويات",
  "الشاي والكابتشينو بدون سكر، وسكر الستيفيا مسموح",
  "بسكوت الستيفيا وقت ما أشتهي بس، مو يومي",
  "الجمعة راحتي ووجبة الدلع",
  "أقيس وزني ومقاساتي مرة بالشهر بنفس يوم البداية"
];
const WATER_RULES = [
  "لترين إلى لترين ونص باليوم",
  "أيام النادي: قارورة زيادة أشربها وأنا أتمرن",
  "أبدأ يومي بكوب ماء أول ما أصحى، وكوب قبل الغدا",
  "القارورة معي بالسيارة وعلى مكتبي بالدوام",
  "الشاي والقهوة ما تنحسب من الماء"
];
const EXTRA_RULES = [
  ["يوم الزلة","إذا أكلت شي برا الجدول أو فوّت تمرين، أرجع للوجبة اللي بعدها مباشرة، بدون تعويض ولا عقاب. اللي يخرب الخطة إني أوقف، مو يوم واحد."],
  ["النوم","٧ ساعات على الأقل. قلة النوم تزيد الجوع وتثقّل التمرين."],
  ["الجوع بعد النادي","أجهز سناكي من قبل: السموذي أو زبادي يوناني مع تمرة، عشان الجوع ما يخليني آكل أي شي."],
  ["القياس","مرة بالشهر بنفس يوم البداية، الصبح قبل الفطور وبنفس الملابس: الوزن والخصر والمؤخرة والفخذ والذراع، وصورة لنفسي."]
];

const EX = [
  {id:"warm", ar:"إحماء: مشي على السير ببطء ثم أسرع", en:"Warm-up", part:"القلب والنفس", a:"٥ إلى ٨ دقايق", b:"٥ إلى ٨ دقايق", sets:[1,1], kg:false},
  {id:"leg", ar:"جهاز دفع الرجلين", en:"Leg Press", part:"الفخذ والمؤخرة", a:"٢ × ١٢", b:"٣ × ١٢", sets:[2,3], kg:true, yt:"https://www.youtube.com/watch?v=oB3lpMSis_4"},
  {id:"lat", ar:"سحب من فوق", en:"Lat Pulldown", part:"الظهر", a:"٢ × ١٢", b:"٣ × ١٢", sets:[2,3], kg:true, yt:"https://www.youtube.com/watch?v=rpkWBC1gCcE"},
  {id:"chest", ar:"جهاز دفع الصدر", en:"Seated Chest Press", part:"الصدر واليدين", a:"٢ × ١٢", b:"٣ × ١٢", sets:[2,3], kg:true, yt:"https://www.youtube.com/watch?v=CIykDiF4sfg"},
  {id:"row", ar:"سحب وأنا جالسة", en:"Seated Row", part:"وسط الظهر والقوام", a:"٢ × ١٢", b:"٣ × ١٢", sets:[2,3], kg:true, yt:"https://www.youtube.com/watch?v=cAeBmvpt31A"},

/* ============ STORAGE ============ */
const store = {
  mode:"local", col:null, db:null, timers:{}, chains:{},
  async init(){
    try{
      if(window.claude && typeof claude.use === "function"){
        const timeout = new Promise(r => setTimeout(()=>r(null), 10000));
        const [user, db] = await Promise.race([Promise.all([claude.use("user"), claude.use("db")]), timeout.then(()=>[null,null])]);
        if(user && db){
          const uid = await user.id();
          if(uid){
            this.db = db; this.col = db.collection("data/users/"+uid);
            try{ await this.col.doc("ping").set({t:1}); this.mode = "db"; }catch(e){ this.mode = "local"; }
          }
        }
      }
    }catch(e){ this.mode = "local"; }
    setSync(this.mode==="db" ? "ok" : "local");
  },
  async get(k, def){
    if(this.mode==="db"){
      try{ const s = await this.col.doc(k).get(); return s.exists ? clone(s.data()) : clone(def); }
      catch(e){ setSync("err"); return clone(def); }
    }
    try{ const v = localStorage.getItem("nh:"+k); return v ? JSON.parse(v) : clone(def); }catch(e){ return clone(def); }
  },
  save(k, obj){
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(()=>{
      const data = clone(obj);
      const prev = this.chains[k] || Promise.resolve();
      this.chains[k] = prev.then(()=>this.write(k,data)).catch(()=>{});
    }, 500);
  },
  async write(k, data){
    if(this.mode==="db"){
      try{ await this.col.doc(k).set(data); setSync("ok"); }
      catch(e){
        if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await this.col.doc(k).set(data); setSync("ok"); return; }catch(e2){} }
        if(e && e.code==="invalid_argument"){ this.mode="local"; try{ localStorage.setItem("nh:"+k, JSON.stringify(data)); }catch(_){} setSync("local"); return; }
        setSync("err"); toast(e && e.code==="quota_exceeded" ? "المساحة امتلأت، احذفي بيانات قديمة" : "ما انحفظ التعديل، جربي مرة ثانية");
      }
    } else { try{ localStorage.setItem("nh:"+k, JSON.stringify(data)); }catch(e){} }
  },
  async all(){
    const o = {};
    if(this.mode==="db"){ const q = await this.col.get(); q.docs.forEach(d => o[d.id] = d.data()); return o; }
    try{ for(let i=0;i<localStorage.length;i++){ const key = localStorage.key(i); if(key.startsWith("nh:")) o[key.slice(3)] = JSON.parse(localStorage.getItem(key)); } }catch(e){}
    return o;
  }
};
function setSync(s){
  const el = $("#sync"); if(!el) return;
  if(s==="ok") el.innerHTML = '<span class="dot"></span>محفوظ';
  else if(s==="err") el.innerHTML = '<span class="dot" style="background:var(--bad)"></span>خطأ بالحفظ';
  else el.innerHTML = '<span class="dot" style="background:var(--warn)"></span>حفظ على هذا الجهاز';
}

const allFoods = () => FOODS.concat(S.foods.items || []);
const findFood = id => allFoods().find(f => f.id===id);
function totals(list){ const t={k:0,p:0,c:0,f:0,fb:0}; (list||[]).forEach(e=>{ t.k+=e.k||0; t.p+=e.p||0; t.c+=e.c||0; t.f+=e.f||0; t.fb+=e.fb||0; }); return t; }
function nutr(food, grams){ const x=(Number(grams)||0)/100; return {k:food.k*x,p:food.p*x,c:food.c*x,f:food.f*x,fb:(food.fb||0)*x}; }
function weekNo(k){ const d = diffDays(k, S.profile.startDate||START_DATE); return d<0 ? 1 : Math.floor(d/7)+1; }
function phaseB(k){ return weekNo(k) >= 3; }
function stepTarget(k){ const w = weekNo(k); if(w<=2) return {min:6000,max:7000}; if(w<=4) return {min:8000,max:8000}; return {min:8000,max:10000}; }
function latestMeasure(){ const m=(S.measures.items||[]).slice().sort((a,b)=>a.date<b.date?-1:1); return m[m.length-1]; }
function currentWeight(){ const m=latestMeasure(); return m && m.weight ? Number(m.weight) : Number(S.profile.startWeight); }
function suggestKcal(){
  const P=S.profile, w=currentWeight();
  const bmr = 10*w + 6.25*Number(P.height) - 5*Number(P.age) + (P.sex==="m"?5:-161);
  const tdee = bmr*1.375;
  return { bmr:r0(bmr), tdee:r0(tdee), target: Math.max(1200, Math.round((tdee-500)/50)*50) };
}
function macroTargets(){ const k=Number(S.profile.kcal)||1600; return { p:Number(S.profile.protein)||100, c:r0(k*0.45/4), f:r0(k*0.30/9), fb:25 }; }

  <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--${color})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
}
function bar(pct,color){ return `<div class="bar"><i style="width:${clamp(pct,0,1)*100}%;background:var(--${color})"></i></div>`; }
function barChart(vals, labels, target, color, unit){
  const W=320,H=150,pl=8,pr=34,pt=12,pb=22, n=vals.length;
  const mx = Math.max(target||0, ...vals.map(v=>v||0), 1)*1.1;
  const bw=(W-pl-pr)/n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني">`;
  [0,0.5,1].forEach(g=>{ const y=pt+(H-pt-pb)*(1-g); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-pr+4}" y="${y+3}">${r0(mx*g/1.1*1.1)}</text>`; });
  vals.forEach((v,i)=>{ const h=(H-pt-pb)*((v||0)/mx); const x=pl+i*bw+bw*0.2; s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*0.6}" height="${Math.max(h,0)}" rx="5" fill="var(--${color})" opacity="${i===n-1?1:0.6}"/><text x="${x+bw*0.3}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; });
  if(target){ const y=pt+(H-pt-pb)*(1-target/mx); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>`; }
  return s+"</svg>";
}
function lineChart(points, color, unit){
  if(points.length<2) return `<div class="note small">تحتاجين قياسين على الأقل عشان يطلع الرسم.</div>`;
  const W=320,H=160,pl=8,pr=36,pt=14,pb=24;
  const ys=points.map(p=>p.v), mn=Math.min(...ys), mx=Math.max(...ys), pad=Math.max((mx-mn)*0.2,1);
  const lo=mn-pad, hi=mx+pad;
  const t0=fromKey(points[0].d).getTime(), t1=fromKey(points[points.length-1].d).getTime(), span=Math.max(t1-t0,1);
  const X=d=>pl+(W-pl-pr)*((fromKey(d).getTime()-t0)/span), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم الوزن">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{ const y=Y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-pr+4}" y="${y+3}">${r1(v)}</text>`; });
  const path=points.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=path+` L${X(points[points.length-1].d).toFixed(1)} ${H-pb} L${X(points[0].d).toFixed(1)} ${H-pb} Z`;
  s+=`<path d="${area}" fill="var(--${color})" opacity=".12"/><path d="${path}" fill="none" stroke="var(--${color})" stroke-width="2.5" stroke-linejoin="round"/>`;
  points.forEach((p,i)=>{ const last=i===points.length-1; s+=`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${last?5:3}" fill="var(--${color})"/>`; });
  s+=`<text x="${X(points[0].d)}" y="${H-6}" text-anchor="start">${fmtShort(points[0].d)}</text><text x="${X(points[points.length-1].d)}" y="${H-6}" text-anchor="end">${fmtShort(points[points.length-1].d)}</text>`;
  return s+"</svg>";
}
function spark(vals,color){
  if(vals.length<2) return "";
  const W=90,H=28, mn=Math.min(...vals), mx=Math.max(...vals), sp=Math.max(mx-mn,0.0001);
  const pts=vals.map((v,i)=>`${(W*i/(vals.length-1)).toFixed(1)},${(H-3-(H-6)*(v-mn)/sp).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${color})" stroke-width="2"/></svg>`;
}

async function estimateFood(){
  const name = $("#nfName").value.trim(); if(!name){ toast("اكتبي اسم الأكل أول"); return; }
  const btn=$("#estBtn"), msg=$("#estMsg"); btn.disabled=true; msg.textContent="يحسب...";
  try{
    const prompt = `أعطني القيم الغذائية التقريبية لكل 100 جرام من هذا الأكل كما يؤكل عادة في السعودية: "${name}". أجب بكائن JSON فقط بدون أي نص آخر، بهذا الشكل: {"kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"piece_name":null,"piece_grams":null}. piece_name و piece_grams لوحدة شائعة مثل حبة أو علبة أو شريحة، أو null إذا ما فيه وحدة واضحة.`;
    const v = await S.sample.json(prompt, {modelTier:"quick"});
    const o = typeof v === "string" ? JSON.parse(v) : v;
    $("#nfK").value=r0(o.kcal); $("#nfP").value=r1(o.protein); $("#nfC").value=r1(o.carbs); $("#nfF").value=r1(o.fat); $("#nfFb").value=r1(o.fiber||0);

    <section class="card"><h2>السناك عند الجوع</h2><div class="small muted" style="margin:4px 0">واحد منهم بس، وقت ما أجوع مو بموعد ثابت.</div><ul class="clean small">${SNACKS.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>
    <section class="card"><h2>بدائل أبدل فيها أي يوم</h2><div class="list" style="margin-top:6px">${ALTS.map(a=>`<div class="item" style="display:block"><b>${esc(a[0])}</b><div class="small">${esc(a[1])}</div></div>`).join("")}</div></section>
    <section class="card"><h2>قواعدي الثابتة</h2><ul class="clean small" style="margin-top:8px">${RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></section>
    <section class="card"><h2>${ic("water","water")}الماء</h2><ul class="clean small" style="margin-top:8px">${WATER_RULES.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></section>
    ${EXTRA_RULES.map(r=>`<section class="card"><h2>${esc(r[0])}</h2><div class="small" style="margin-top:6px">${esc(r[1])}</div></section>`).join("")}
    <section class="card"><div class="chead"><h2>قائمة المشتريات</h2><button class="btn ghost" onclick="S.shop.checked={};saveShop();render()">مسح العلامات</button></div>
      ${SHOP.map(([g,items])=>`<h3>${esc(g)}</h3>${items.map(it=>{const id="sh-"+g+"-"+it;return `<label class="check ${checked[it]?"done":""}" for="${esc(id)}"><input type="checkbox" id="${esc(id)}" ${checked[it]?"checked":""} onchange="toggleShop('${esc(it)}')"><span>${esc(it)}</span></label>`;}).join("")}`).join("")}
    </section>
  </div>`;
}
function toggleShop(it){ S.shop.checked = S.shop.checked||{}; S.shop.checked[it] = !S.shop.checked[it]; saveShop(); render(); }

/* ============ SETTINGS ============ */
function openSettings(){
  const P=S.profile, sg=suggestKcal(), custom=S.foods.items||[];
  openSheet(`<h2>الإعدادات</h2>
    <div class="grid2">
      <label for="pN">الاسم<input id="pN" value="${esc(P.name||"")}"></label>
      <label for="pX">الجنس<select id="pX"><option value="f" ${P.sex!=="m"?"selected":""}>أنثى</option><option value="m" ${P.sex==="m"?"selected":""}>ذكر</option></select></label>
      <label for="pB">حجم قارورتي مل<input id="pB" type="number" value="${P.bottle||500}"></label>
      <label for="pH">الطول سم<input id="pH" type="number" value="${P.height}"></label>
      <label for="pA">العمر<input id="pA" type="number" value="${P.age}"></label>
      <label for="pSW">وزن البداية كجم<input id="pSW" type="number" step="0.1" value="${P.startWeight}"></label>
      <label for="pGW">الوزن الهدف كجم<input id="pGW" type="number" step="0.1" value="${P.goalWeight}"></label>
      <label for="pK">هدف السعرات<input id="pK" type="number" step="50" value="${P.kcal}"></label>
      <label for="pP">هدف البروتين جم<input id="pP" type="number" value="${P.protein}"></label>
      <label for="pW">هدف الماء مل<input id="pW" type="number" step="250" value="${P.water}"></label>
      <label for="pS">تاريخ البداية<input id="pS" type="date" value="${P.startDate}"></label>
    </div>
    <div class="note small" style="margin-top:10px">حسب وزنك الحالي ${r1(currentWeight())} كجم: الحرق الأساسي تقريبًا ${sg.bmr} سعرة، ومع نشاط خفيف ${sg.tdee}. لنزول تدريجي تقريبًا نص كيلو بالأسبوع: <b>${sg.target}</b> سعرة. <button class="btn ghost" onclick="$('#pK').value=${sg.target}">استخدميه</button></div>
    <h3>أيام النادي</h3>${gymPicker()}
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="saveSettings()">احفظي</button></div>
    <h3>التنبيهات</h3>
    <div class="note small">التنبيهات داخل التطبيق تطلع لك في الرئيسية كل ما فتحتيه: يوم النادي، الماء، الوجبات، الخطوات، النوم، وموعد القياس. أما تنبيهات الجوال وهو مقفل، فهذي تنحط في تقويم جوالك.</div>
    <h3>أكلاتي المضافة</h3>
    ${custom.length?`<div class="list">${custom.map(f=>`<div class="item"><div><div class="t">${esc(f.n)}</div><div class="small muted">${r0(f.k)} سعرة · بروتين ${f.p} · كارب ${f.c} · دهون ${f.f} لكل ١٠٠ جم</div></div><button class="x" aria-label="حذف" onclick="delCustom('${f.id}')">×</button></div>`).join("")}</div>`:`<div class="small muted">ما أضفتِ أكل بعد.</div>`}
    <h3>نسخة احتياطية</h3>
    <div class="small muted">بياناتك ${store.mode==="db"?"محفوظة في حسابك وتوصل لها من أي جهاز":"محفوظة على هذا الجهاز بس"}. تقدرين تنسخينها وترجعينها وقت ما تبين.</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="downloadData()">نزّلي نسخة ملف</button><button class="btn sm" onclick="exportData()">انسخي بياناتي</button><button class="btn sm" onclick="showImport()">رجّعي بيانات</button></div>
    <label class="btn sm" for="impFile" style="display:inline-block;margin-top:8px;color:var(--ink)">رجّعي من ملف<input id="impFile" type="file" accept="application/json,.json" style="display:none" onchange="importFile(this)"></label>
    <div id="impBox"></div>`);
}
function saveSettings(){
  const P=S.profile;
  P.height=Number($("#pH").value)||P.height; P.age=Number($("#pA").value)||P.age; P.startWeight=Number($("#pSW").value)||P.startWeight; P.goalWeight=Number($("#pGW").value)||P.goalWeight;
  P.name=$("#pN").value.trim(); P.sex=$("#pX").value; P.bottle=Number($("#pB").value)||P.bottle||500; const g=readGym(); P.gymDays=g.days; P.gymTimes=g.times; rebuild();
  P.kcal=Number($("#pK").value)||P.kcal; P.protein=Number($("#pP").value)||P.protein; P.water=Number($("#pW").value)||P.water; P.startDate=$("#pS").value||P.startDate;
  saveProfile(); closeSheet(); toast("انحفظت الإعدادات"); render();
}
function delCustom(id){ S.foods.items = S.foods.items.filter(f=>f.id!==id); saveFoods(); openSettings(); }
async function exportData(){
  try{ const all = await store.all(); await navigator.clipboard.writeText(JSON.stringify(all)); toast("انسخت بياناتك، الصقيها في ملاحظة"); }
  catch(e){ const all = await store.all(); $("#impBox").innerHTML = `<label for="expT" style="margin-top:8px">انسخي النص هذا<textarea id="expT" rows="5">${esc(JSON.stringify(all))}</textarea></label>`; }
}
async function downloadData(){
  const all = await store.all(); const blob = new Blob([JSON.stringify(all)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sehati-backup-"+TODAY()+".json"; document.body.appendChild(a); a.click(); a.remove(); toast("نزلت النسخة");
}
async function importFile(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  try{ const o = JSON.parse(await f.text()); for(const [k,v] of Object.entries(o)){ if(v && typeof v==="object") await store.write(k,v); } S.days={}; await loadCore(); await afterLoad(); closeSheet(); toast("رجعت بياناتك"); render(); }
  catch(e){ toast("الملف مو صحيح"); }
}
function showImport(){ $("#impBox").innerHTML = `<label for="impT" style="margin-top:8px">الصقي النسخة هنا<textarea id="impT" rows="5"></textarea></label><button class="btn pri sm" style="margin-top:8px" onclick="importData()">رجّعيها</button>`; }
async function importData(){
  let o; try{ o = JSON.parse($("#impT").value); }catch(e){ toast("النص مو صحيح"); return; }
  for(const [k,v] of Object.entries(o)){ if(v && typeof v==="object") await store.write(k,v); }
  S.days={}; await loadCore(); await afterLoad(); closeSheet(); toast("رجعت بياناتك"); render();
}


/* ============ PERSONALIZATION ============ */
const PLAN_BASE = clone(PLAN);
let PLAN_DOC = {days:{}};
function mDay(){ return Number((S.profile.startDate||START_DATE).slice(8)) || 1; }
function gymDaysText(){ const g=(S.profile.gymDays||[]); return g.length ? WEEK_ORDER.filter(d=>g.includes(d)).map(d=>AR_DAYS[d]+(S.profile.gymTimes&&S.profile.gymTimes[d]?" ("+S.profile.gymTimes[d]+")":"")).join("، ") : "ما حددتِ أيام"; }
function rebuild(){
  Object.keys(GYM).forEach(k=>delete GYM[k]);
  (S.profile.gymDays||[]).forEach(d=>{ GYM[d] = (S.profile.gymTimes&&S.profile.gymTimes[d]) || "حسب وقتك"; });
  for(const d of [0,1,2,3,4,5,6]){ PLAN[d] = Object.assign({}, PLAN_BASE[d], (PLAN_DOC.days||{})[d]||{}); }
}
async function afterLoad(){
  if(!S.profile.onboarded && Number(S.profile.height)>0 && Number(S.profile.startWeight)>0){ S.profile.onboarded=true; saveProfile(); }
  PLAN_DOC = await store.get("plan", {days:{}});
  rebuild();
  if(!S.profile.onboarded) setTimeout(openOnboard, 300);
}
function editDay(wd){
  const p = PLAN[wd];
  openSheet(`<h2>خطة ${AR_DAYS[wd]}</h2>
    <label for="eb">الفطور<textarea id="eb" rows="2">${esc(p.b)}</textarea></label>
    <label for="es" style="margin-top:8px">السناك<textarea id="es" rows="2">${esc(p.s)}</textarea></label>
    <label for="el" style="margin-top:8px">الغدا<textarea id="el" rows="2">${esc(p.l)}</textarea></label>
    <div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveDayPlan(${wd})">احفظي</button><button class="btn" onclick="resetDayPlan(${wd})">رجّعي المقترح</button><button class="btn" onclick="closeSheet()">إلغاء</button></div>`);
}
function saveDayPlan(wd){ PLAN_DOC.days = PLAN_DOC.days||{}; PLAN_DOC.days[wd] = {b:$("#eb").value.trim(), s:$("#es").value.trim(), l:$("#el").value.trim()}; store.save("plan", PLAN_DOC); rebuild(); closeSheet(); toast("انحفظت خطة "+AR_DAYS[wd]); render(); }
function resetDayPlan(wd){ if(PLAN_DOC.days) delete PLAN_DOC.days[wd]; store.save("plan", PLAN_DOC); rebuild(); closeSheet(); render(); }
function gymPicker(){
  const g = S.profile.gymDays||[], t = S.profile.gymTimes||{};
  return `<div class="list">${WEEK_ORDER.map(d=>`<div class="item"><label class="row" for="gd${d}" style="color:var(--ink);font-size:15px"><input type="checkbox" id="gd${d}" style="width:20px;height:20px;accent-color:var(--accent)" ${g.includes(d)?"checked":""}> ${AR_DAYS[d]}</label><input id="gt${d}" placeholder="الوقت (اختياري)" value="${esc(t[d]||"")}" style="max-width:170px"></div>`).join("")}</div>`;
}
function readGym(){ const days=[], times={}; WEEK_ORDER.forEach(d=>{ if($("#gd"+d).checked) days.push(d); const v=$("#gt"+d).value.trim(); if(v) times[d]=v; }); return {days,times}; }
function openOnboard(){
  if(!$("#sheet").hidden) return;
  openSheet(`<h2>أهلًا بك في صحتي</h2>
    <div class="small muted" style="margin-bottom:12px">عبّي بياناتك مرة وحدة، ويحسب لك التطبيق هدف السعرات ويبدأ متابعتك من اليوم. بياناتك لك أنتِ بس.</div>
    <div class="grid2">
      <label for="oN">اسمك<input id="oN"></label>
      <label for="oS">الجنس<select id="oS"><option value="f">أنثى</option><option value="m">ذكر</option></select></label>
      <label for="oA">العمر<input id="oA" type="number" inputmode="numeric"></label>
      <label for="oH">الطول سم<input id="oH" type="number" inputmode="decimal"></label>
      <label for="oW">وزنك اليوم كجم<input id="oW" type="number" inputmode="decimal" step="0.1"></label>
      <label for="oG">الوزن الهدف كجم<input id="oG" type="number" inputmode="decimal" step="0.1"></label>
      <label for="oB">حجم قارورة مويتك مل<input id="oB" type="number" inputmode="numeric" value="500"></label>
    </div>
    <h3>أيام النادي</h3>${gymPicker()}
    <div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveOnboard()">ابدئي</button></div>`);
}
function saveOnboard(){
  const P=S.profile, w=Number($("#oW").value), h=Number($("#oH").value), a=Number($("#oA").value);
  if(!(w>0&&h>0&&a>0)){ toast("اكتبي العمر والطول والوزن"); return; }
  P.name=$("#oN").value.trim(); P.sex=$("#oS").value; P.age=a; P.height=h; P.startWeight=w; P.goalWeight=Number($("#oG").value)||P.goalWeight||w;
  P.bottle=Number($("#oB").value)||500; const g=readGym(); P.gymDays=g.days; P.gymTimes=g.times; P.startDate=TODAY(); P.onboarded=true;
  S.measures.items.push({id:"m"+Date.now(), date:TODAY(), weight:w, waist:null, hip:null, thigh:null, arm:null, note:"قياس البداية"}); saveMeasures();
  P.kcal = suggestKcal().target; P.protein = Math.round(Math.max(60, w*1.0)/5)*5;
  saveProfile(); rebuild(); closeSheet(); toast("هدفك "+P.kcal+" سعرة باليوم، تقدرين تغيرينه من الإعدادات"); render();
}

/* ============ BOOT ============ */
async function loadCore(){
  const [p,f,m,l,sh] = await Promise.all([
    store.get("profile", PROFILE_DEF), store.get("foods", {items:[]}), store.get("measures", {items:[]}), store.get("labs", {items:[]}), store.get("shop", {checked:{}})
  ]);
  S.profile = Object.assign(clone(PROFILE_DEF), p); S.foods = {items:f.items||[]}; S.measures = {items:m.items||[]}; S.labs = {items:l.items||[]}; S.shop = {checked:sh.checked||{}};
}
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
(async function boot(){
  await store.init();
  await loadCore();
  await afterLoad();
  try{ if(window.claude && claude.use){ claude.use("sample").then(s=>{ S.sample = s || null; }).catch(()=>{}); } }catch(e){}
  const h = (location.hash||"").replace("#","");
  go(TITLES[h] ? h : "home");
  document.addEventListener("visibilitychange", async ()=>{ if(document.visibilityState==="visible"){ S.days={}; await loadCore(); await afterLoad(); render(); } });
  window.addEventListener("hashchange", ()=>{ const t=(location.hash||"").replace("#",""); if(TITLES[t] && t!==S.tab) go(t); });
})();
</script>
</body>
</html>
